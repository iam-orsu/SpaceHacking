# SpaceVE-1 Hacking Lab — Docker Compose
#
# Network layout:
#   192.168.60.10   ground-station   Ground station command gateway
#   192.168.60.11   moc              Mission Operations Center (MOC)
#   192.168.60.50   attacker         Your machine (runs outside containers)
#   192.168.60.100  satellite        SpaceVE-1 — cFS flight software
#
# Intentional misconfigurations (training targets, not bugs):
#   - MOC accepts commands from any source IP in the lab network
#   - Satellite accepts any correctly formatted CCSDS packet over UDP
#   - Default credentials on MOC and ground station
#   - No encryption on any link
#   - No network segmentation between ground-station and MOC

version: "3.8"

networks:
  spacelab:
    name: spacelab
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.60.0/24
          gateway: 192.168.60.1

services:

  # ---------------------------------------------------------------
  # SpaceVE-1 Satellite — cFS flight software
  # Listens for CCSDS commands on UDP 1234 (CI_LAB)
  # Sends telemetry to MOC on UDP 1235 (TO_LAB)
  # No authentication. Checksum only.
  # ---------------------------------------------------------------
  satellite:
    build:
      context: ./simulators/satellite
      dockerfile: Dockerfile
    image: spaceve1-satellite:lab
    container_name: spaceve1-satellite
    hostname: satellite
    networks:
      spacelab:
        ipv4_address: 192.168.60.100
    ports:
      - "1234:1234/udp"
    environment:
      - SATELLITE_ID=SpaceVE-1
      - ORBIT_ALT_KM=400
      - TLM_DEST_IP=192.168.60.11
      - TLM_DEST_PORT=1235
      - CMD_LISTEN_PORT=1234
    volumes:
      - satellite-logs:/cfs/build/exe/cpu1/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-x", "core-cpu1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # Mission Operations Center (MOC)
  # Web interface: http://192.168.60.11:8080
  # Default credentials: admin / admin123
  # Telemetry receiver: UDP 1235
  # No source IP validation on command input
  # ---------------------------------------------------------------
  moc:
    build:
      context: ./simulators/moc
      dockerfile: Dockerfile
    image: spaceve1-moc:lab
    container_name: spaceve1-moc
    hostname: moc.spacesys.local
    networks:
      spacelab:
        ipv4_address: 192.168.60.11
    ports:
      - "8080:8080"
      - "1235:1235/udp"
    environment:
      - MOC_USERNAME=admin
      - MOC_PASSWORD=admin123
      - SATELLITE_IP=192.168.60.100
      - SATELLITE_CMD_PORT=1234
      - TLM_LISTEN_PORT=1235
      - SECRET_KEY=spaceve1-dev-secret-do-not-use-in-prod
    volumes:
      - moc-data:/app/data
    depends_on:
      satellite:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # Ground Station — Command uplink gateway
  # TCP command port: 4820 (accepts from any source)
  # Default credentials: gsoperator / password123
  # No source IP filtering on command forwarding
  # ---------------------------------------------------------------
  ground-station:
    build:
      context: ./simulators/ground-station
      dockerfile: Dockerfile
    image: spaceve1-groundstation:lab
    container_name: spaceve1-groundstation
    hostname: groundstation.spacesys.local
    networks:
      spacelab:
        ipv4_address: 192.168.60.10
    ports:
      - "4820:4820/tcp"
      - "5900:5900/tcp"
    environment:
      - GS_USERNAME=gsoperator
      - GS_PASSWORD=password123
      - MOC_IP=192.168.60.11
      - MOC_PORT=8080
      - SATELLITE_IP=192.168.60.100
      - SATELLITE_CMD_PORT=1234
    depends_on:
      moc:
        condition: service_healthy
    restart: unless-stopped

volumes:
  satellite-logs:
    name: spaceve1-satellite-logs
  moc-data:
    name: spaceve1-moc-data
