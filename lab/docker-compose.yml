# SpaceVE-1 Space Systems Security Lab
#
# Architecture (Phase 2 — no Flask, no REST):
#   Satellites  -> CCSDS binary TM -> MOC UDP :5000
#   MOC         -> asyncio WebSocket :8765, HTTP :8080
#   Operators   -> WS browser or nc -> GS TCP :4820 -> CCSDS UDP -> Satellites
#
# Network segments:
#   spacelab-cmd   192.168.61.0/24  command uplink  (GS, MOC cmd interface, satellites)
#   spacelab-tlm   192.168.62.0/24  telemetry downlink (satellites TM -> MOC)
#   spacelab-admin 192.168.63.0/24  management (DB, IRS, Prometheus, Grafana)
#
# Intentional misconfigurations (training targets, no CVEs):
#   MC-GS-3   GS-BETA maintenance mode — no authentication
#   MC-GS-4   GS CMD command — raw CCSDS hex relay, no validation
#   MC-GS-5   Sequence counter replay window = full 14-bit range
#   MC-MOC-1  MOC WebSocket telemetry readable without authentication
#   MC-MOC-2  MD5 password hashing in operator DB
#   MC-MOC-3  MOC on all 3 networks (no network segmentation)
#   MC-SAT-1  Satellite CMD port has no source IP filtering
#   MC-GRF-1  Grafana default credentials admin/admin
#
# Attack chain:
#   1. nmap localhost -> discover GS-BETA :4820 open, no auth banner
#   2. nc localhost 4820 -> SENDCMD SpaceVE-1A DOWNLINK_ENABLE
#   3. Subscribe to ws://localhost:8765 -> read CONFIDENTIAL mission data
#   4. Replay captured CCSDS packets via CMD hex (large sequence window)
#   5. SAFING_MODE -> mission operational impact
#
# Start: cd lab && docker compose up --build -d
# Stop:  cd lab && docker compose down -v

networks:
  spacelab-cmd:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.61.0/24
          gateway: 192.168.61.1
    driver_opts:
      com.docker.network.bridge.name: br-spacecmd

  spacelab-tlm:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.62.0/24
          gateway: 192.168.62.1
    driver_opts:
      com.docker.network.bridge.name: br-spacetlm

  spacelab-admin:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.63.0/24
          gateway: 192.168.63.1
    driver_opts:
      com.docker.network.bridge.name: br-spaceadm

volumes:
  telemetry-db-data:
  grafana-data:
  prometheus-data:

services:

  # ---------------------------------------------------------------
  # TELEMETRY DATABASE
  # Misconfiguration: on both tlm and admin networks
  # ---------------------------------------------------------------
  telemetry-db:
    build: ./services/telemetry-db
    container_name: spaceve1-tlmdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: spaceve1
      POSTGRES_USER: spaceops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spaceops2024}
    volumes:
      - telemetry-db-data:/var/lib/postgresql/data
    networks:
      spacelab-tlm:
        ipv4_address: 192.168.62.20
      spacelab-admin:
        ipv4_address: 192.168.63.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceops -d spaceve1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # SATELLITES
  # On both cmd (receive commands) and tlm (send TLM to MOC)
  # ---------------------------------------------------------------
  satellite-1:
    build: ./services/satellite
    container_name: spaceve1-sat-a
    restart: unless-stopped
    environment:
      SATELLITE_ID: "A"
      SATELLITE_NAME: "SpaceVE-1A"
      SAT_APID: "0x200"
      INCLINATION: "51.6"
      RAAN: "0.0"
      MEAN_ANOMALY: "0.0"
      CMD_PORT: "1234"
      TLM_HOST: "192.168.62.10"
      TLM_PORT: "5000"
      TIME_WARP: "60"
    networks:
      spacelab-cmd:
        ipv4_address: 192.168.61.100
      spacelab-tlm:
        ipv4_address: 192.168.62.100
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f satellite_sim.py || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  satellite-2:
    build: ./services/satellite
    container_name: spaceve1-sat-b
    restart: unless-stopped
    environment:
      SATELLITE_ID: "B"
      SATELLITE_NAME: "SpaceVE-1B"
      SAT_APID: "0x201"
      INCLINATION: "51.6"
      RAAN: "120.0"
      MEAN_ANOMALY: "120.0"
      CMD_PORT: "1234"
      TLM_HOST: "192.168.62.10"
      TLM_PORT: "5000"
      TIME_WARP: "60"
    networks:
      spacelab-cmd:
        ipv4_address: 192.168.61.101
      spacelab-tlm:
        ipv4_address: 192.168.62.101
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f satellite_sim.py || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  satellite-3:
    build: ./services/satellite
    container_name: spaceve1-sat-c
    restart: unless-stopped
    environment:
      SATELLITE_ID: "C"
      SATELLITE_NAME: "SpaceVE-1C"
      SAT_APID: "0x202"
      INCLINATION: "97.6"
      RAAN: "240.0"
      MEAN_ANOMALY: "240.0"
      CMD_PORT: "1234"
      TLM_HOST: "192.168.62.10"
      TLM_PORT: "5000"
      TIME_WARP: "60"
    networks:
      spacelab-cmd:
        ipv4_address: 192.168.61.102
      spacelab-tlm:
        ipv4_address: 192.168.62.102
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f satellite_sim.py || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------
  # GROUND STATIONS
  # TCP operator console, no Flask, plain socket server
  # MC-GS-3: GS-BETA maintenance mode = no auth
  # ---------------------------------------------------------------
  ground-station-1:
    build: ./services/ground-station
    container_name: spaceve1-gs1
    restart: unless-stopped
    environment:
      GS_ID: "GS-ALPHA"
      GS_LAT: "28.5"
      GS_LON: "-80.5"
      GS_PASSWORD: "gs_alpha_2024"
      MAINTENANCE_MODE: "false"
      LISTEN_PORT: "4820"
      SAT_A_IP: "192.168.61.100"
      SAT_B_IP: "192.168.61.101"
      SAT_C_IP: "192.168.61.102"
    networks:
      spacelab-cmd:
        ipv4_address: 192.168.61.20

  ground-station-2:
    build: ./services/ground-station
    container_name: spaceve1-gs2
    restart: unless-stopped
    environment:
      GS_ID: "GS-BETA"
      GS_LAT: "51.5"
      GS_LON: "-0.1"
      GS_PASSWORD: "password123"      # MC-GS-1: weak default credential
      MAINTENANCE_MODE: "true"        # MC-GS-3: no auth required
      LISTEN_PORT: "4820"
      SAT_A_IP: "192.168.61.100"
      SAT_B_IP: "192.168.61.101"
      SAT_C_IP: "192.168.61.102"
    ports:
      - "4820:4820"                   # exposed — primary pentest entry point
    networks:
      spacelab-cmd:
        ipv4_address: 192.168.61.21

  # ---------------------------------------------------------------
  # MISSION OPERATIONS CENTER (asyncio, no Flask)
  # Receives CCSDS TM via UDP, serves WebSocket + static HTTP
  # Misconfiguration: on all 3 networks (MC-MOC-3)
  # ---------------------------------------------------------------
  moc:
    build: ./services/moc
    container_name: spaceve1-moc
    restart: unless-stopped
    depends_on:
      telemetry-db:
        condition: service_healthy
    environment:
      MOC_ID: "PRIMARY"
      TLM_LISTEN_PORT: "5000"
      WS_PORT: "8765"
      HTTP_PORT: "8080"
      DB_HOST: "192.168.62.20"
      DB_PORT: "5432"
      DB_NAME: "spaceve1"
      DB_USER: "spaceops"
      DB_PASS: ${DB_PASSWORD:-spaceops2024}
      GS1_HOST: "192.168.61.20"
      GS1_PORT: "4820"
      GS1_TOKEN: "gs_alpha_2024"
      GS2_HOST: "192.168.61.21"
      GS2_PORT: "4820"
      NASA_API_KEY: ${NASA_API_KEY:-}
      NASA_API_URL: ${NASA_API_URL:-https://api.nasa.gov/planetary/earth/imagery}
    ports:
      - "8080:8080"   # browser dashboard
      - "8765:8765"   # WebSocket (MC-MOC-1: no auth for TLM read)
    networks:
      spacelab-cmd:
        ipv4_address: 192.168.61.10
      spacelab-tlm:
        ipv4_address: 192.168.62.10
      spacelab-admin:
        ipv4_address: 192.168.63.10
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('0.0.0.0', 8080)); s.close()\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # INCIDENT RESPONSE SYSTEM
  # Polls DB every 60s with 600s detection lag
  # Misconfiguration: on all 3 networks
  # ---------------------------------------------------------------
  incident-response:
    build: ./services/incident-response
    container_name: spaceve1-irs
    restart: unless-stopped
    depends_on:
      telemetry-db:
        condition: service_healthy
    environment:
      DB_HOST: "192.168.63.20"
      DB_PORT: "5432"
      DB_NAME: "spaceve1"
      DB_USER: "spaceops"
      DB_PASS: ${DB_PASSWORD:-spaceops2024}
      DETECTION_LAG_S: "600"
      POLL_INTERVAL: "60"
    networks:
      spacelab-cmd:
        ipv4_address: 192.168.61.30
      spacelab-tlm:
        ipv4_address: 192.168.62.30
      spacelab-admin:
        ipv4_address: 192.168.63.30

  # ---------------------------------------------------------------
  # PROMETHEUS
  # ---------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: spaceve1-prometheus
    restart: unless-stopped
    volumes:
      - ./services/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      spacelab-admin:
        ipv4_address: 192.168.63.40
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  # ---------------------------------------------------------------
  # GRAFANA
  # MC-GRF-1: default credentials admin/admin
  # ---------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: spaceve1-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./services/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3000:3000"
    networks:
      spacelab-admin:
        ipv4_address: 192.168.63.41
    depends_on:
      - prometheus

  # ---------------------------------------------------------------
  # SATCOM TERMINAL MODEM
  # Firmware update agent on TCP 9000
  # MC-MODEM-1: no authentication on update interface
  # MC-MODEM-2: URL passed to wget with no validation or signature check
  # MC-MODEM-3: downloaded binary executed immediately, no integrity check
  # ---------------------------------------------------------------
  satcom-modem:
    build: ./services/satcom-modem
    container_name: spaceve1-satcom
    restart: unless-stopped
    networks:
      spacelab-admin:
        ipv4_address: 192.168.63.51

  # ---------------------------------------------------------------
  # NETWORK ENFORCER
  # Documents MC-MOC-3: MOC spans all 3 networks (segmentation violation)
  # iptables rules here show INTENT; MOC's multi-homed presence defeats them
  # ---------------------------------------------------------------
  network-enforcer:
    image: ubuntu:22.04
    container_name: spaceve1-netfirewall
    restart: "no"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./scripts/enforce_networks.sh:/enforce_networks.sh:ro
    command: bash /enforce_networks.sh
    networks:
      spacelab-cmd:
        ipv4_address: 192.168.61.50
      spacelab-tlm:
        ipv4_address: 192.168.62.50
      spacelab-admin:
        ipv4_address: 192.168.63.50
