<!DOCTYPE html>
<html>
<head>
  <title>SpaceVE-1 MOC Logs</title>
  <style>
    body { font-family: monospace; background: #0a0a0a; color: #00ff41; margin: 0; padding: 20px; }
    nav { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
    nav a { color: #00ff41; text-decoration: none; }
    .logout { margin-left: auto; color: #888; }
    h2 { color: #aaa; font-size: 0.9em; letter-spacing: 3px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8em; }
    th { color: #555; text-align: left; padding: 4px 8px; border-bottom: 1px solid #222; }
    td { padding: 4px 8px; border-bottom: 1px solid #111; color: #aaa; }
    td.api { color: #ff4444; }
    td.raw { font-size: 0.75em; color: #333; }
  </style>
</head>
<body>
  <nav>
    <a href="/">DASHBOARD</a>
    <a href="/command">COMMAND</a>
    <a href="/logs">LOGS</a>
    <span class="logout">{{ user }} | <a href="/logout" style="color:#555">LOGOUT</a></span>
  </nav>

  <h2>SPACEVE-1 // COMMAND LOG (last 100)</h2>

  <table>
    <tr>
      <th>ID</th><th>TIME (UTC)</th><th>OPERATOR</th><th>SOURCE IP</th>
      <th>APID</th><th>FC</th><th>COMMAND</th><th>RAW HEX</th>
    </tr>
    {% for row in rows %}
    <tr>
      <td>{{ row[0] }}</td>
      <td>{{ row[1][:19] }}</td>
      <td class="{% if row[2] == 'api' %}api{% endif %}">{{ row[2] }}</td>
      <td>{{ row[3] }}</td>
      <td>{{ row[4] }}</td>
      <td>{{ row[5] }}</td>
      <td>{{ row[6] }}</td>
      <td class="raw">{{ row[7][:32] }}...</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
