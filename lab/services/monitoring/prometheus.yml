global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MOC HTTP health endpoint (no /metrics - connection refused is expected)
  - job_name: 'moc'
    static_configs:
      - targets: ['moc:8080']
    metrics_path: '/metrics'

  # Satellites expose no Prometheus metrics - targets show as down (expected)
  - job_name: 'satellite-1'
    static_configs:
      - targets: ['satellite-1:8080']
    metrics_path: '/metrics'

  - job_name: 'satellite-2'
    static_configs:
      - targets: ['satellite-2:8080']
    metrics_path: '/metrics'

  - job_name: 'satellite-3'
    static_configs:
      - targets: ['satellite-3:8080']
    metrics_path: '/metrics'

  # Ground stations expose no Prometheus metrics - targets show as down (expected)
  - job_name: 'ground-station-1'
    static_configs:
      - targets: ['ground-station-1:4820']

  - job_name: 'ground-station-2'
    static_configs:
      - targets: ['ground-station-2:4820']

  # Incident-response service (no metrics endpoint - expected)
  - job_name: 'incident-response'
    static_configs:
      - targets: ['incident-response:8080']
